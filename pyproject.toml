[project]
name = "callmissed-playground"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.137.0", "uvicorn[standard]==0.49.0", "httpx==0.28.1",
  "pydantic-settings==2.13.1", "itsdangerous==2.2.0", "websockets==17.0.1"
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
